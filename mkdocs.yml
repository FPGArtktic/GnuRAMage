site_name: GnuRAMage
site_description: RAM disk mirroring with periodic rsync write-back — single-file Bash tool
site_author: Mateusz Okulanis
site_url: https://gnuramage.readthedocs.io/
repo_name: FPGArtktic/GnuRAMage
repo_url: https://github.com/FPGArtktic/GnuRAMage
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2025–2026 Mateusz Okulanis — GPL-3.0-or-later

docs_dir: docs
strict: true

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  language: en
  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - User guide:
      - Getting started: guide/getting-started.md
      - Configuration: guide/configuration.md
      - Command line: guide/cli.md
      - Operations: guide/operations.md
      - Troubleshooting: guide/troubleshooting.md
  - Architecture:
      - Overview: architecture/index.md
      - Runtime behaviour: architecture/runtime.md
      - Data safety model: architecture/data-safety.md
      - Function map: architecture/function-map.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Release process: development/release.md
      - Known issues: development/known-issues.md
      - Roadmap: development/roadmap.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FPGArtktic
